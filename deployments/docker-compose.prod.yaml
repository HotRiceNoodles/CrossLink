services:
  gateway:
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile
    restart: unless-stopped
    environment:
      - CL_DATABASE_HOST=postgres
      - CL_DATABASE_PORT=5432
      - CL_DATABASE_USER=${DB_USER:-crosslink}
      - CL_DATABASE_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD}
      - CL_DATABASE_DBNAME=${DB_NAME:-crosslink}
      - CL_DATABASE_SSLMODE=${DB_SSLMODE:-disable}
      - CL_REDIS_HOST=redis
      - CL_REDIS_PORT=6379
      - CL_REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - CL_GATEWAY_AUTH_KEY=${GATEWAY_AUTH_KEY:?Set GATEWAY_AUTH_KEY}
      - CL_ADMIN_JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET}
      - CL_ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ${FRONTEND_PATH:-..}
      dockerfile: ${FRONTEND_DOCKERFILE:-deployments/docker/Dockerfile.frontend}
      args:
        FRONTEND_REPO_REF: ${FRONTEND_REF:-main}
    ports:
      - "80:80"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-crosslink}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-crosslink}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-crosslink}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli ${REDIS_PASSWORD:+-a $REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
