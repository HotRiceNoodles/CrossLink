# git-cliff configuration for CrossLink.
#
# Parses the project's Conventional Commits (feat/fix/docs/style/test/refactor/perf/chore + scope)
# and renders Keep a Changelog 1.1.0 format. Usage:
#
#   make changelog          # regenerate CHANGELOG.md (review before committing)
#
# See https://git-cliff.org/docs/configuration for all options.

[changelog]
header = """
# Changelog\n
All notable changes to this project will be documented in this file.\n
The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""
# template renders one section per release tag; commits without a tag between
# them land in an Unreleased block at the top.
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}\
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | upper_first }}{% if commit.breaking %} (**BREAKING**){% endif %}
{% endfor %}\
{% endfor %}\n
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
require_conventional = false
protect_breaking_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
parse_conventional = true

# Commit type -> Keep a Changelog section
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^doc", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^style", group = "Changed" },
  { message = "^test", group = "Tests" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "Miscellaneous" },
  { message = ".*deprecated", group = "Deprecated" },
  { message = ".*breaking", group = "Changed" },
  { message = ".*security", group = "Security" },
  { message = "^revert", group = "Reverted" },
  { message = ".*", group = "Miscellaneous" }, # unconventional commits still show up
]
filter_commits = false
date_format = "%Y-%m-%d"
