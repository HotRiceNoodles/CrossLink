server:
  port: 8080
  read_timeout: 30s
  write_timeout: 120s

database:
  driver: postgres          # postgres | kingbasees | mysql | oceanbase | sqlite
  # --- PostgreSQL / KingbaseES / MySQL / OceanBase ---
  host: localhost
  port: 5432                # PG 5432 | KingbaseES 54321 | MySQL 3306 | OceanBase 2883
  user: postgres
  password: postgres
  dbname: crosslink
  sslmode: disable          # PostgreSQL / KingbaseES only
  # --- SQLite ---
  # sqlite_path: ./data/crosslink.db

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0
  pool_size: 500        # connection pool size (increase for high concurrency)
  min_idle_conns: 50    # minimum idle connections

gateway:
  auth_key: "lgw-change-me"
  # base_url: "https://api.your-gateway.com"  # Public URL for key delivery emails
  # internal_allow_cidrs:                       # Permit outbound provider/MCP/video
  #   - "10.0.0.0/8"                            # connections to these restricted CIDRs (on-prem
  #   - "192.168.0.0/16"                        # self-hosted LLMs). Empty/absent = block ALL
                                              # restricted ranges (default, most secure). Cloud
                                              # metadata (169.254.x.x) and loopback stay blocked
                                              # unless explicitly listed. Env: CL_GATEWAY_INTERNAL_ALLOW_CIDRS

rate_limit:
  # Global defaults applied when API Key / Team / Org has no explicit RPM/TPM override.
  # Set to 0 to disable (recommended: manage limits per API Key/Team/Org instead).
  rpm: 0               # requests per minute (0 = unlimited)
  tpm: 0               # tokens per minute (0 = unlimited)
  tpm_reservation: 2000 # tokens pre-reserved per request (fallback when body estimation unavailable)
  # fail_closed: false  # when true, reject requests if Redis is unreachable

logging:
  level: info
  format: json

admin:
  username: admin
  password: admin123
  jwt_secret: "dev-secret-change-in-production"
  token_expiry: 24

secret_manager:
  encryption_key: "aU8za9Ezj+PMGvWr0F2YLb1oLiNxD7nEq4CbdWsP5ek="    # gm: 3DYiFuVMEbi77ENlkqyWqg==

crypto:
  mode: standard          # standard (SHA-256/RSA/AES) or gm (SM3/SM2/SM4)

# SMTP mail server for key delivery emails (Pro/Enterprise)
# Supports STARTTLS on port 587 only. Implicit TLS (port 465) is not supported.
# Credentials can also be set via env vars: CL_SMTP_HOST, CL_SMTP_PORT, etc.
# smtp:
#   host: smtp.example.com
#   port: 587
#   username: ""
#   password: ""
#   from: noreply@example.com

# API Key IP binding (Pro/Enterprise only). Community ignores this section.
ip_binding:
  notify_cooldown_seconds: 300  # min 60, max 86400; cooldown (seconds) between email alerts per key on IP mismatch

license:
  # server_url: "http://localhost:8090"   # License Server address
  # license_key: ""                        # Filled after online activation
  heartbeat_enabled: true
  heartbeat_interval: 24h

captcha:
    enabled: true
    provider: slider
    trust_days: 7
    trust_ip_mask: 24
    redis_fail_open: true
    slider:
        tolerance_px: 5
        min_points: 5
        bg_width: 300
        bg_height: 150
        piece_size: 44
mcp:
  enabled: true
  # allow_stdio: false   # SECURITY: stdio MCP servers spawn LOCAL subprocesses
                         # configured by MCP server admins. Disabled by default —
                         # enabling lets any admin with mcp:create (incl. org_admin
                         # in multi-tenant) execute arbitrary commands on the
                         # gateway host. Only enable in a single-tenant/trusted
                         # deployment or with host isolation. Commercial build.
