services:
  gateway:
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile.cn
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile.frontend.cn
      args:
        FRONTEND_REPO_REF: ${FRONTEND_REF:-main}
    ports:
      - "${CL_SERVER_PORT:-80}:80"
    volumes:
      - ../deployments/nginx/frontend-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crosslink
      POSTGRES_PASSWORD: crosslink_dev
      POSTGRES_DB: crosslink
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crosslink"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
