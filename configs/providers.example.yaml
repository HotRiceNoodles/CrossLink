providers:
  # --- OpenAI Compatible ---
  - name: deepseek
    display_name: DeepSeek
    adapter_type: openai_compatible
    base_url: https://api.deepseek.com/v1
    api_key: ${DEEPSEEK_API_KEY}
    models:
      - model_name: claude-sonnet-4-20250514
        provider_model: deepseek-chat
        weight: 3
        priority: 1
        input_price: 0.0014
        output_price: 0.0028

