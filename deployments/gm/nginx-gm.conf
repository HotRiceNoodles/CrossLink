# GmSSL/Nginx reverse proxy for GM TLS termination
#
# Prerequisites:
#   1. Build or pull GmSSL-enabled Nginx image
#   2. Generate SM2 dual certificates: certgen --mode=sm2 --out-dir=./certs --host=<your-host>
#   3. Place certs in ./certs/ directory
#
# NOTE: GmSSL/Nginx configuration syntax varies by version.
# The directives below use the GmSSL fork syntax (dual certificate).
# Adjust if using a different GmSSL/Nginx build.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream gateway {
        server gateway:8080;
    }

    # GM TLS server — dual certificate (sign + enc)
    server {
        listen 443 ssl;
        server_name _;

        # SM2 dual certificates
        ssl_sign_certificate      /etc/gm/certs/sm2_sign.crt;
        ssl_sign_certificate_key  /etc/gm/certs/sm2_sign.key;
        ssl_enc_certificate       /etc/gm/certs/sm2_enc.crt;
        ssl_enc_certificate_key   /etc/gm/certs/sm2_enc.key;

        # GM TLS protocol and cipher suite
        ssl_protocols TLCPv1.1;
        ssl_ciphers ECDHE-SM2-SM4-CBC-SM3;

        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Proxy to Gateway
        location / {
            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # SSE / streaming support
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
